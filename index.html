<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>One Town Centre</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }


    body {
      background: #EAF4F5;

      color: #24383B;

      font-family:
        "Avenir Next LT Pro",
        "Avenir Next",
        Avenir,
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* -----------------------------------
       PAGE
    ----------------------------------- */

    .page {
      width: 100vw;
      height: 100vh;

      padding:
        clamp(34px, 4.2vh, 68px)
        clamp(48px, 5vw, 96px);

      display: flex;
      flex-direction: column;
    }


    /* -----------------------------------
       HEADER
    ----------------------------------- */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 40px;

      margin-bottom:
        clamp(48px, 6.3vh, 88px);
    }


    .heading {
      margin: 0;

      color: #17636B;

      font-size:
        clamp(34px, 3.1vw, 58px);

      line-height: 1.05;

      font-weight: 600;

      letter-spacing: -0.035em;

      white-space: nowrap;
    }


    .datetime {
      color:
        rgba(23, 99, 107, 0.52);

      font-size:
        clamp(22px, 1.8vw, 32px);

      line-height: 1;

      font-weight: 400;

      letter-spacing: -0.02em;

      white-space: nowrap;

      text-align: right;
    }


    /* -----------------------------------
       EVENT LIST
    ----------------------------------- */

    .events {
      display: flex;
      flex-direction: column;

      gap:
        clamp(12px, 1.5vh, 22px);

      flex: 1;
      min-height: 0;
    }


    /* -----------------------------------
       STANDARD EVENT
    ----------------------------------- */

    .event {
      --event-color: #17636B;

      min-height:
        clamp(76px, 9.2vh, 108px);

      display: grid;

      grid-template-columns:
        clamp(130px, 11.5vw, 185px)
        1fr;

      overflow: hidden;

      border-radius:
        clamp(8px, 0.7vw, 12px);

      background:
        rgba(255, 255, 255, 0.64);
    }


    /* -----------------------------------
       NEXT EVENT
       Only the next future event gets this.
    ----------------------------------- */

    .event.next {
      min-height:
        clamp(108px, 13vh, 152px);

      background:
        rgba(255, 255, 255, 0.82);
    }


    /* -----------------------------------
       DATE BLOCK
    ----------------------------------- */

    .date-block {
      background:
        var(--event-color);

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      gap:
        clamp(8px, 0.7vw, 13px);

      padding:
        8px
        clamp(10px, 1vw, 16px);
    }


    .day {
      font-size:
        clamp(42px, 4vw, 68px);

      line-height: 0.95;

      font-weight: 600;

      letter-spacing: -0.055em;
    }


    .date-text {
      display: flex;
      flex-direction: column;
      justify-content: center;

      min-width: 0;

      line-height: 1;
    }


    .month {
      font-size:
        clamp(15px, 1.25vw, 21px);

      font-weight: 600;

      letter-spacing: 0.06em;
    }


    .weekday {
      margin-top:
        clamp(5px, 0.5vh, 8px);

      font-size:
        clamp(13px, 1.05vw, 18px);

      font-weight: 500;

      letter-spacing: 0.09em;

      opacity: 0.88;
    }


    /* -----------------------------------
       DETAILS
    ----------------------------------- */

    .details {
      display: grid;

      grid-template-columns:
        clamp(190px, 16vw, 290px)
        minmax(270px, 1fr)
        minmax(280px, 1.15fr);

      align-items: center;

      gap:
        clamp(18px, 2vw, 38px);

      padding:
        clamp(13px, 1.55vh, 22px)
        clamp(24px, 2.8vw, 48px);
    }


    .event-meta {
      color: #637A7D;

      font-size:
        clamp(18px, 1.55vw, 27px);

      font-weight: 500;

      white-space: nowrap;
    }


    .event-info {
      min-width: 0;

      display: flex;
      flex-direction: column;

      justify-content: center;
    }


    .title {
      color: #203B3E;

      font-size:
        clamp(22px, 1.9vw, 34px);

      line-height: 1.15;

      font-weight: 600;

      letter-spacing: -0.025em;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    .location {
      margin-top:
        clamp(2px, 0.3vh, 6px);

      color: #6D8487;

      font-size:
        clamp(16px, 1.25vw, 22px);

      line-height: 1.2;

      font-weight: 500;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    /* -----------------------------------
       DESCRIPTION
    ----------------------------------- */

    .description {
      min-width: 0;

      padding-left:
        clamp(18px, 1.8vw, 32px);

      border-left:
        1px solid
        rgba(23, 99, 107, 0.14);

      color: #60777A;

      font-size:
        clamp(15px, 1.2vw, 21px);

      line-height: 1.35;

      font-weight: 400;

      display: -webkit-box;

      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;

      overflow: hidden;
    }


    .description.empty {
      border-left-color:
        rgba(23, 99, 107, 0.07);
    }


    /* -----------------------------------
       NEXT EVENT EMPHASIS
    ----------------------------------- */

    .event.next .title {
      font-size:
        clamp(25px, 2.15vw, 38px);
    }


    .event.next .description {
      font-size:
        clamp(16px, 1.3vw, 23px);

      -webkit-line-clamp: 3;
    }


    /* -----------------------------------
       COMPLETED TODAY
    ----------------------------------- */

    .event.past {
      min-height:
        clamp(76px, 9.2vh, 108px);

      background:
        rgba(255, 255, 255, 0.34);
    }


    .event.past .date-block {
      background: #AEBDBF;
    }


    .event.past .event-meta,
    .event.past .title,
    .event.past .location,
    .event.past .description {
      color: #89999B;
    }


    .event.past .description {
      border-left-color:
        rgba(110, 130, 133, 0.12);
    }


    /* -----------------------------------
       HOLIDAYS
    ----------------------------------- */

    .event.holiday {
      background:
        rgba(255, 255, 255, 0.36);
    }


    .event.holiday .date-block {
      background: #B8CBCD;

      color:
        rgba(255, 255, 255, 0.95);
    }


    .event.holiday .details {
      grid-template-columns: 1fr;
    }


    .event.holiday .event-meta,
    .event.holiday .description {
      display: none;
    }


    .event.holiday .title {
      color: #788E91;

      font-weight: 500;
    }


    /*
     * A holiday should not become visually
     * huge simply because it is the next item.
     */

    .event.holiday.next {
      min-height:
        clamp(76px, 9.2vh, 108px);

      background:
        rgba(255, 255, 255, 0.36);
    }


    .event.holiday.next .title {
      font-size:
        clamp(22px, 1.9vw, 34px);
    }


    /* -----------------------------------
       EMPTY
    ----------------------------------- */

    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;

      flex: 1;

      color: #758E91;

      font-size:
        clamp(24px, 2vw, 36px);

      font-weight: 400;
    }


    /* -----------------------------------
       STATUS
    ----------------------------------- */

    .status {
      position: fixed;

      right: 28px;
      bottom: 20px;

      color:
        rgba(23, 99, 107, 0.38);

      font-size: 13px;

      opacity: 0;

      transition:
        opacity 0.4s ease;

      pointer-events: none;
    }


    .status.visible {
      opacity: 1;
    }


    /* -----------------------------------
       SMALLER SCREENS
    ----------------------------------- */

    @media (max-width: 1100px) {

      .page {
        padding:
          32px
          42px;
      }


      .header {
        margin-bottom: 42px;
      }


      .heading {
        font-size: 34px;
      }


      .datetime {
        font-size: 22px;
      }


      .event {
        grid-template-columns:
          125px
          1fr;
      }


      .day {
        font-size: 44px;
      }


      .details {
        grid-template-columns:
          170px
          minmax(220px, 1fr)
          minmax(220px, 1fr);

        gap: 18px;

        padding:
          12px
          24px;
      }

    }


  </style>

</head>


<body>

  <main class="page">

    <header class="header">

      <h1 class="heading">
        Upcoming at One Town Centre
      </h1>

      <div
        id="datetime"
        class="datetime"
      ></div>

    </header>


    <section
      id="events"
      class="events"
    ></section>

  </main>


  <div
    id="status"
    class="status"
  ></div>


  <script>

    /* -----------------------------------
       SETTINGS
    ----------------------------------- */

    const DATA_URL =
      'https://script.google.com/macros/s/AKfycbxWtIDDI_p34Ast0sKObU-2z5mp-UNApWQ9RTICJizoeXlqmY-BLu56pRgJf1Dwzonh/exec';

    const MAX_UPCOMING_EVENTS = 5;

    const LOOKAHEAD_DAYS = 60;

    const REFRESH_INTERVAL =
      5 * 60 * 1000;


    /* -----------------------------------
       DATE + TIME
    ----------------------------------- */

    function updateDateTime() {

      const now =
        new Date();


      const date =
        now.toLocaleDateString(
          'en-CA',
          {
            weekday: 'long',
            month: 'long',
            day: 'numeric'
          }
        );


      const time =
        now.toLocaleTimeString(
          'en-CA',
          {
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
          }
        );


      document
        .getElementById('datetime')
        .textContent =
          date +
          ' · ' +
          time;

    }


    updateDateTime();

    setInterval(
      updateDateTime,
      30000
    );


    /* -----------------------------------
       LOAD DATA
    ----------------------------------- */

    function loadEvents() {

      const callbackName =
        'calendarCallback_' +
        Date.now();


      const script =
        document.createElement(
          'script'
        );


      window[callbackName] =
        function(data) {

          try {

            const prepared =
              prepareEvents(
                Array.isArray(data)
                  ? data
                  : []
              );


            renderEvents(
              prepared
            );


            showStatus(
              'Updated'
            );

          }

          finally {

            delete window[
              callbackName
            ];


            script.remove();

          }

        };


      script.onerror =
        function() {

          delete window[
            callbackName
          ];


          script.remove();


          showStatus(
            'Update unavailable'
          );

        };


      script.src =
        DATA_URL +
        '?callback=' +
        callbackName +
        '&_=' +
        Date.now();


      document.body.appendChild(
        script
      );

    }


    /* -----------------------------------
       PREPARE EVENTS
    ----------------------------------- */

    function prepareEvents(events) {

      const now =
        new Date();


      const today =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        );


      const tomorrow =
        new Date(today);

      tomorrow.setDate(
        tomorrow.getDate() + 1
      );


      const cutoff =
        new Date(today);

      cutoff.setDate(
        cutoff.getDate() +
        LOOKAHEAD_DAYS
      );


      const pastToday = [];

      const upcoming = [];


      events.forEach(event => {

        if (!event.sortDate) {
          return;
        }


        const start =
          new Date(
            event.sortDate
          );


        if (
          start < today ||
          start > cutoff
        ) {
          return;
        }


        /*
         * Holidays are never treated as
         * completed timed events.
         */

        if (
          event.type === 'holiday'
        ) {

          upcoming.push(
            {
              ...event,
              isPast: false
            }
          );

          return;
        }


        const end =
          event.endDate
            ? new Date(event.endDate)
            : start;


        const startedToday =
          start >= today &&
          start < tomorrow;


        const hasEnded =
          !event.allDay &&
          end < now;


        if (
          startedToday &&
          hasEnded
        ) {

          pastToday.push(
            {
              ...event,
              isPast: true
            }
          );

        } else {

          upcoming.push(
            {
              ...event,
              isPast: false
            }
          );

        }

      });


      /*
       * Past events stay at the top in
       * chronological order.
       */

      pastToday.sort(
        (a, b) =>
          new Date(a.sortDate) -
          new Date(b.sortDate)
      );


      upcoming.sort(
        (a, b) =>
          new Date(a.sortDate) -
          new Date(b.sortDate)
      );


      /*
       * Maximum five future items.
       * Today's completed items are additional.
       */

      const futureItems =
        upcoming.slice(
          0,
          MAX_UPCOMING_EVENTS
        );


      /*
       * The first actual building event that
       * hasn't passed becomes the large card.
       *
       * Holidays deliberately remain normal size.
       */

      let nextAssigned =
        false;


      futureItems.forEach(
        event => {

          event.isNext =
            false;


          if (
            !nextAssigned &&
            event.type !== 'holiday'
          ) {

            event.isNext =
              true;

            nextAssigned =
              true;
          }

        }
      );


      return pastToday.concat(
        futureItems
      );

    }


    /* -----------------------------------
       RENDER
    ----------------------------------- */

    function renderEvents(events) {

      const container =
        document.getElementById(
          'events'
        );


      if (
        !events ||
        events.length === 0
      ) {

        container.innerHTML =
          '<div class="empty-state">' +
          'No upcoming building events' +
          '</div>';

        return;

      }


      container.innerHTML =
        events
          .map(
            event =>
              buildEventHTML(
                event
              )
          )
          .join('');

    }


    /* -----------------------------------
       BUILD EVENT
    ----------------------------------- */

    function buildEventHTML(
      event
    ) {

      const holiday =
        event.type ===
        'holiday';


      const classes = [
        'event'
      ];


      if (holiday) {
        classes.push(
          'holiday'
        );
      }


      if (event.isPast) {
        classes.push(
          'past'
        );
      }


      if (event.isNext) {
        classes.push(
          'next'
        );
      }


      const color =
        isValidHexColor(
          event.color
        )
          ? event.color
          : '#17636B';


      const location =
        !holiday &&
        event.location
          ? `
              <div class="location">
                ${escapeHTML(event.location)}
              </div>
            `
          : '';


      const description =
        !holiday &&
        event.description
          ? `
              <div class="description">
                ${escapeHTML(event.description)}
              </div>
            `
          : `
              <div class="description empty"></div>
            `;


      const time =
        event.time
          ? escapeHTML(
              event.time
            )
          : '';


      return `
        <article
          class="${classes.join(' ')}"
          style="--event-color: ${color};"
        >

          <div class="date-block">

            <div class="day">
              ${escapeHTML(event.day || '')}
            </div>

            <div class="date-text">

              <div class="month">
                ${escapeHTML(event.month || '')}
              </div>

              <div class="weekday">
                ${escapeHTML(event.weekday || '')}
              </div>

            </div>

          </div>


          <div class="details">

            <div class="event-meta">
              ${time}
            </div>


            <div class="event-info">

              <div class="title">
                ${escapeHTML(event.title || '')}
              </div>

              ${location}

            </div>


            ${description}

          </div>

        </article>
      `;

    }


    /* -----------------------------------
       HELPERS
    ----------------------------------- */

    function isValidHexColor(
      value
    ) {

      return (
        typeof value ===
          'string' &&
        /^#[0-9A-Fa-f]{6}$/.test(
          value
        )
      );

    }


    function escapeHTML(
      value
    ) {

      return String(
        value ?? ''
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    function showStatus(
      text
    ) {

      const element =
        document.getElementById(
          'status'
        );


      element.textContent =
        text;


      element.classList.add(
        'visible'
      );


      clearTimeout(
        window.statusTimer
      );


      window.statusTimer =
        setTimeout(
          () => {

            element.classList.remove(
              'visible'
            );

          },
          2500
        );

    }


    /* -----------------------------------
       INITIAL LOAD
    ----------------------------------- */

    loadEvents();


    setInterval(
      loadEvents,
      REFRESH_INTERVAL
    );

  </script>

</body>
</html>
