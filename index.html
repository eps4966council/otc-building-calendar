<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>One Town Centre</title>

  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: #EAF4F5;

      color: #24383B;

      font-family:
        "Avenir Next LT Pro",
        "Avenir Next",
        Avenir,
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }


    /* -----------------------------------
       PAGE
    ----------------------------------- */

    .page {
      width: 100vw;
      height: 100vh;

      padding:
        clamp(34px, 4.2vh, 68px)
        clamp(48px, 5vw, 96px);

      display: flex;
      flex-direction: column;
    }


    /* -----------------------------------
       HEADER
    ----------------------------------- */

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 40px;

      margin-bottom:
        clamp(48px, 6.3vh, 88px);
    }

    .heading {
      margin: 0;

      color: #17636B;

      font-size:
        clamp(34px, 3.1vw, 58px);

      line-height: 1.05;

      font-weight: 600;

      letter-spacing: -0.035em;

      white-space: nowrap;
    }

    .datetime {
      color: rgba(23, 99, 107, 0.52);

      font-size:
        clamp(22px, 1.8vw, 32px);

      line-height: 1;

      font-weight: 400;

      letter-spacing: -0.02em;

      white-space: nowrap;

      text-align: right;
    }


    /* -----------------------------------
       EVENT LIST
    ----------------------------------- */

    .events {
      display: flex;
      flex-direction: column;

      gap:
        clamp(12px, 1.5vh, 22px);

      flex: 1;
      min-height: 0;
    }


    /* -----------------------------------
       EVENT ROW
    ----------------------------------- */

    .event {
      --event-color: #17636B;

      min-height:
        clamp(76px, 10vh, 118px);

      display: grid;

      grid-template-columns:
        clamp(130px, 11.5vw, 185px)
        1fr;

      overflow: hidden;

      border-radius:
        clamp(8px, 0.7vw, 12px);

      background:
        rgba(255, 255, 255, 0.64);
    }


    /* -----------------------------------
       DATE BLOCK
    ----------------------------------- */

    .date-block {
      background: var(--event-color);

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      gap:
        clamp(8px, 0.7vw, 13px);

      padding:
        8px
        clamp(10px, 1vw, 16px);
    }

    .day {
      font-size:
        clamp(42px, 4vw, 68px);

      line-height: 0.95;

      font-weight: 600;

      letter-spacing: -0.055em;
    }

    .date-text {
      display: flex;
      flex-direction: column;
      justify-content: center;

      min-width: 0;

      line-height: 1;
    }

    .month {
      font-size:
        clamp(15px, 1.25vw, 21px);

      font-weight: 600;

      letter-spacing: 0.06em;
    }

    .weekday {
      margin-top:
        clamp(5px, 0.5vh, 8px);

      font-size:
        clamp(13px, 1.05vw, 18px);

      font-weight: 500;

      letter-spacing: 0.09em;

      opacity: 0.88;
    }


    /* -----------------------------------
       EVENT DETAILS
    ----------------------------------- */

    .details {
      display: grid;

      grid-template-columns:
        clamp(220px, 19vw, 350px)
        1fr;

      align-items: center;

      gap:
        clamp(18px, 2vw, 38px);

      padding:
        clamp(13px, 1.55vh, 22px)
        clamp(24px, 2.8vw, 48px);
    }

    .event-meta {
      color: #637A7D;

      font-size:
        clamp(18px, 1.65vw, 29px);

      font-weight: 500;

      white-space: nowrap;
    }

    .event-info {
      min-width: 0;

      display: flex;
      flex-direction: column;

      justify-content: center;
    }

    .title {
      color: #203B3E;

      font-size:
        clamp(23px, 2.1vw, 37px);

      line-height: 1.15;

      font-weight: 600;

      letter-spacing: -0.025em;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }

    .location {
      margin-top:
        clamp(2px, 0.3vh, 6px);

      color: #6D8487;

      font-size:
        clamp(16px, 1.35vw, 23px);

      line-height: 1.2;

      font-weight: 500;

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;
    }


    /* -----------------------------------
       HOLIDAYS
    ----------------------------------- */

    .event.holiday {
      background:
        rgba(255, 255, 255, 0.36);
    }

    .event.holiday .date-block {
      background: #B8CBCD;

      color:
        rgba(255, 255, 255, 0.95);
    }

    .event.holiday .details {
      grid-template-columns: 1fr;
    }

    .event.holiday .event-meta {
      display: none;
    }

    .event.holiday .title {
      color: #788E91;

      font-weight: 500;
    }


    /* -----------------------------------
       EMPTY STATE
    ----------------------------------- */

    .empty {
      display: flex;
      align-items: center;
      justify-content: center;

      flex: 1;

      color: #758E91;

      font-size:
        clamp(24px, 2vw, 36px);

      font-weight: 400;
    }


    /* -----------------------------------
       STATUS
    ----------------------------------- */

    .status {
      position: fixed;

      right: 28px;
      bottom: 20px;

      color:
        rgba(23, 99, 107, 0.38);

      font-size: 13px;

      opacity: 0;

      transition:
        opacity 0.4s ease;

      pointer-events: none;
    }

    .status.visible {
      opacity: 1;
    }


    /* -----------------------------------
       SMALLER SCREENS
    ----------------------------------- */

    @media (max-width: 1100px) {

      .page {
        padding:
          32px
          42px;
      }

      .header {
        margin-bottom: 42px;
      }

      .heading {
        font-size: 34px;
      }

      .datetime {
        font-size: 22px;
      }

      .event {
        grid-template-columns:
          125px
          1fr;
      }

      .day {
        font-size: 44px;
      }

      .details {
        grid-template-columns:
          190px
          1fr;

        padding:
          12px
          24px;
      }

    }


  </style>
</head>


<body>

  <main class="page">

    <header class="header">

      <h1 class="heading">
        Upcoming at One Town Centre
      </h1>

      <div
        id="datetime"
        class="datetime"
      ></div>

    </header>


    <section
      id="events"
      class="events"
    ></section>

  </main>


  <div
    id="status"
    class="status"
  ></div>


  <script>

    /* -----------------------------------
       SETTINGS
    ----------------------------------- */

    const DATA_URL =
      'https://script.google.com/macros/s/AKfycbxWtIDDI_p34Ast0sKObU-2z5mp-UNApWQ9RTICJizoeXlqmY-BLu56pRgJf1Dwzonh/exec';

    const MAX_EVENTS = 6;

    const LOOKAHEAD_DAYS = 60;

    const REFRESH_INTERVAL =
      5 * 60 * 1000;


    /* -----------------------------------
       DATE + TIME
    ----------------------------------- */

    function updateDateTime() {

      const now =
        new Date();


      const date =
        now.toLocaleDateString(
          'en-CA',
          {
            weekday: 'long',
            month: 'long',
            day: 'numeric'
          }
        );


      const time =
        now.toLocaleTimeString(
          'en-CA',
          {
            hour: 'numeric',
            minute: '2-digit',
            hour12: true
          }
        );


      document
        .getElementById('datetime')
        .textContent =
          date +
          ' · ' +
          time;

    }


    updateDateTime();

    setInterval(
      updateDateTime,
      30000
    );


    /* -----------------------------------
       LOAD DATA
    ----------------------------------- */

    function loadEvents() {

      const callbackName =
        'calendarCallback_' +
        Date.now();


      const script =
        document.createElement(
          'script'
        );


      window[callbackName] =
        function(data) {

          try {

            const filtered =
              filterEvents(
                Array.isArray(data)
                  ? data
                  : []
              );


            renderEvents(
              filtered
            );


            showStatus(
              'Updated'
            );

          }

          finally {

            delete window[
              callbackName
            ];


            script.remove();

          }

        };


      script.onerror =
        function() {

          delete window[
            callbackName
          ];


          script.remove();


          showStatus(
            'Update unavailable'
          );

        };


      script.src =
        DATA_URL +
        '?callback=' +
        callbackName +
        '&_=' +
        Date.now();


      document.body.appendChild(
        script
      );

    }


    /* -----------------------------------
       LIMIT EVENTS
    ----------------------------------- */

    function filterEvents(events) {

      const now =
        new Date();


      const today =
        new Date(
          now.getFullYear(),
          now.getMonth(),
          now.getDate()
        );


      const cutoff =
        new Date(today);


      cutoff.setDate(
        cutoff.getDate() +
        LOOKAHEAD_DAYS
      );


      return events

        .filter(event => {

          if (!event.sortDate) {
            return false;
          }


          const date =
            new Date(
              event.sortDate
            );


          return (
            date >= today &&
            date <= cutoff
          );

        })

        .sort(
          (a, b) =>
            new Date(a.sortDate) -
            new Date(b.sortDate)
        )

        .slice(
          0,
          MAX_EVENTS
        );

    }


    /* -----------------------------------
       RENDER
    ----------------------------------- */

    function renderEvents(events) {

      const container =
        document.getElementById(
          'events'
        );


      if (
        !events ||
        events.length === 0
      ) {

        container.innerHTML =
          '<div class="empty">' +
          'No upcoming building events' +
          '</div>';

        return;

      }


      container.innerHTML =
        events
          .map(
            event =>
              buildEventHTML(
                event
              )
          )
          .join('');

    }


    /* -----------------------------------
       BUILD EVENT
    ----------------------------------- */

    function buildEventHTML(
      event
    ) {

      const holiday =
        event.type ===
        'holiday';


      const color =
        isValidHexColor(
          event.color
        )
          ? event.color
          : '#17636B';


      const location =
        !holiday &&
        event.location
          ? `
              <div class="location">
                ${escapeHTML(event.location)}
              </div>
            `
          : '';


      const time =
        event.time
          ? escapeHTML(
              event.time
            )
          : '';


      return `
        <article
          class="event ${holiday ? 'holiday' : ''}"
          style="--event-color: ${color};"
        >

          <div class="date-block">

            <div class="day">
              ${escapeHTML(event.day || '')}
            </div>

            <div class="date-text">

              <div class="month">
                ${escapeHTML(event.month || '')}
              </div>

              <div class="weekday">
                ${escapeHTML(event.weekday || '')}
              </div>

            </div>

          </div>


          <div class="details">

            <div class="event-meta">
              ${time}
            </div>


            <div class="event-info">

              <div class="title">
                ${escapeHTML(event.title || '')}
              </div>

              ${location}

            </div>

          </div>

        </article>
      `;

    }


    /* -----------------------------------
       HELPERS
    ----------------------------------- */

    function isValidHexColor(
      value
    ) {

      return (
        typeof value ===
          'string' &&
        /^#[0-9A-Fa-f]{6}$/.test(
          value
        )
      );

    }


    function escapeHTML(
      value
    ) {

      return String(
        value ?? ''
      )

        .replace(
          /&/g,
          '&amp;'
        )

        .replace(
          /</g,
          '&lt;'
        )

        .replace(
          />/g,
          '&gt;'
        )

        .replace(
          /"/g,
          '&quot;'
        )

        .replace(
          /'/g,
          '&#039;'
        );

    }


    function showStatus(
      text
    ) {

      const element =
        document.getElementById(
          'status'
        );


      element.textContent =
        text;


      element.classList.add(
        'visible'
      );


      clearTimeout(
        window.statusTimer
      );


      window.statusTimer =
        setTimeout(
          () => {

            element.classList.remove(
              'visible'
            );

          },
          2500
        );

    }


    /* -----------------------------------
       INITIAL LOAD + AUTO REFRESH
    ----------------------------------- */

    loadEvents();


    setInterval(
      loadEvents,
      REFRESH_INTERVAL
    );

  </script>

</body>
</html>
