<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>One Town Centre</title>

<style>

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #EAF4F5;
  color: #24383B;

  font-family:
    "Avenir Next LT Pro",
    "Avenir Next",
    Avenir,
    "Helvetica Neue",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}


/* ==================================================
   PAGE
   Designed primarily for 1920 × 1080
================================================== */

.page {
  width: 100vw;
  height: 100vh;

  padding:
    clamp(34px, 4vh, 64px)
    clamp(52px, 4.5vw, 100px);

  display: flex;
  flex-direction: column;
}


/* ==================================================
   HEADER
================================================== */

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 40px;

  margin-bottom:
    clamp(44px, 5.5vh, 76px);

  flex-shrink: 0;
}

.heading {
  margin: 0;

  color: #17636B;

  font-size:
    clamp(36px, 2.8vw, 58px);

  line-height: 1;

  font-weight: 600;

  letter-spacing: -0.035em;

  white-space: nowrap;
}

.datetime {
  color:
    rgba(23, 99, 107, 0.52);

  font-size:
    clamp(21px, 1.55vw, 31px);

  line-height: 1;

  font-weight: 400;

  letter-spacing: -0.02em;

  white-space: nowrap;

  text-align: right;
}


/* ==================================================
   EVENT LIST
================================================== */

.events {
  display: flex;
  flex-direction: column;

  gap:
    clamp(12px, 1.35vh, 18px);

  flex: 1;

  min-height: 0;
}


/* ==================================================
   STANDARD EVENT
================================================== */

.event {
  --event-color: #17636B;

  min-height:
    clamp(80px, 9vh, 108px);

  display: grid;

  grid-template-columns:
    clamp(140px, 10.5vw, 190px)
    1fr;

  overflow: hidden;

  border-radius:
    clamp(8px, 0.6vw, 12px);

  background:
    rgba(255, 255, 255, 0.64);

  flex-shrink: 0;
}


/* ==================================================
   NEXT EVENT
================================================== */

.event.next {
  min-height:
    clamp(112px, 13vh, 150px);

  background:
    rgba(255, 255, 255, 0.82);
}


/* ==================================================
   DATE BLOCK
================================================== */

.date-block {
  background:
    var(--event-color);

  color: white;

  display: flex;
  align-items: center;
  justify-content: center;

  gap:
    clamp(9px, 0.7vw, 14px);

  padding:
    8px
    clamp(10px, 0.9vw, 16px);
}

.day {
  font-size:
    clamp(44px, 3.6vw, 68px);

  line-height: 0.95;

  font-weight: 600;

  letter-spacing: -0.055em;
}

.date-text {
  display: flex;
  flex-direction: column;
  justify-content: center;

  min-width: 0;

  line-height: 1;
}

.month {
  font-size:
    clamp(15px, 1.15vw, 21px);

  font-weight: 600;

  letter-spacing: 0.06em;
}

.weekday {
  margin-top:
    clamp(5px, 0.5vh, 8px);

  font-size:
    clamp(13px, 0.95vw, 18px);

  font-weight: 500;

  letter-spacing: 0.09em;

  opacity: 0.88;
}


/* ==================================================
   EVENT DETAILS

   At 1920px:
   Time ≈ 210px
   Title ≈ largest area
   Description ≈ 31%
================================================== */

.details {
  display: grid;

  grid-template-columns:
    clamp(175px, 12vw, 225px)
    minmax(0, 1.45fr)
    minmax(250px, 0.85fr);

  align-items: center;

  gap:
    clamp(20px, 1.7vw, 34px);

  padding:
    clamp(12px, 1.4vh, 20px)
    clamp(26px, 2.2vw, 42px);

  min-width: 0;
}


/* ==================================================
   TIME
================================================== */

.event-meta {
  color: #637A7D;

  font-size:
    clamp(17px, 1.35vw, 25px);

  line-height: 1.2;

  font-weight: 500;

  white-space: nowrap;
}


/* ==================================================
   TITLE + LOCATION
================================================== */

.event-info {
  min-width: 0;

  display: flex;
  flex-direction: column;

  justify-content: center;
}

.title {
  color: #203B3E;

  font-size:
    clamp(21px, 1.65vw, 32px);

  line-height: 1.12;

  font-weight: 600;

  letter-spacing: -0.025em;

  /*
   * Allow titles to use two lines instead
   * of cutting them off.
   */

  white-space: normal;

  overflow: hidden;

  display: -webkit-box;

  -webkit-box-orient: vertical;

  -webkit-line-clamp: 2;
}

.location {
  margin-top:
    clamp(3px, 0.35vh, 6px);

  color: #6D8487;

  font-size:
    clamp(15px, 1.1vw, 21px);

  line-height: 1.15;

  font-weight: 500;

  overflow: hidden;

  text-overflow: ellipsis;

  white-space: nowrap;
}


/* ==================================================
   DESCRIPTION
================================================== */

.description {
  min-width: 0;

  padding-left:
    clamp(18px, 1.6vw, 30px);

  border-left:
    1px solid
    rgba(23, 99, 107, 0.14);

  color: #60777A;

  font-size:
    clamp(14px, 1.05vw, 20px);

  line-height: 1.32;

  font-weight: 400;

  display: -webkit-box;

  -webkit-box-orient: vertical;

  -webkit-line-clamp: 2;

  overflow: hidden;
}

.description.empty {
  border-left-color:
    rgba(23, 99, 107, 0.07);
}


/* ==================================================
   NEXT EVENT EMPHASIS
================================================== */

.event.next .title {
  font-size:
    clamp(24px, 1.9vw, 36px);

  line-height: 1.12;
}

.event.next .description {
  font-size:
    clamp(15px, 1.12vw, 21px);

  -webkit-line-clamp: 3;
}


/* ==================================================
   COMPLETED TODAY
================================================== */

.event.past {
  min-height:
    clamp(80px, 9vh, 108px);

  background:
    rgba(255, 255, 255, 0.34);
}

.event.past .date-block {
  background: #AEBDBF;
}

.event.past .event-meta,
.event.past .title,
.event.past .location,
.event.past .description {
  color: #89999B;
}

.event.past .description {
  border-left-color:
    rgba(110, 130, 133, 0.12);
}


/* ==================================================
   HOLIDAYS
================================================== */

.event.holiday {
  background:
    rgba(255, 255, 255, 0.36);
}

.event.holiday .date-block {
  background: #B8CBCD;

  color:
    rgba(255, 255, 255, 0.95);
}

.event.holiday .details {
  grid-template-columns: 1fr;
}

.event.holiday .event-meta,
.event.holiday .description {
  display: none;
}

.event.holiday .title {
  color: #788E91;

  font-weight: 500;
}


/*
   Holidays remain normal size even
   if chronologically next.
*/

.event.holiday.next {
  min-height:
    clamp(80px, 9vh, 108px);

  background:
    rgba(255, 255, 255, 0.36);
}

.event.holiday.next .title {
  font-size:
    clamp(21px, 1.65vw, 32px);
}


/* ==================================================
   EMPTY STATE
================================================== */

.empty-state {
  display: flex;
  align-items: center;
  justify-content: center;

  flex: 1;

  color: #758E91;

  font-size:
    clamp(24px, 2vw, 36px);

  font-weight: 400;
}


/* ==================================================
   UPDATE STATUS
================================================== */

.status {
  position: fixed;

  right: 28px;
  bottom: 20px;

  color:
    rgba(23, 99, 107, 0.38);

  font-size: 13px;

  opacity: 0;

  transition:
    opacity 0.4s ease;

  pointer-events: none;
}

.status.visible {
  opacity: 1;
}


/* ==================================================
   1920 × 1080 SIGNAGE OPTIMIZATION
================================================== */

@media (max-width: 1920px) {

  .page {
    padding:
      42px
      72px;
  }

  .header {
    margin-bottom: 52px;
  }

  .heading {
    font-size: 48px;
  }

  .datetime {
    font-size: 25px;
  }

  .event {
    grid-template-columns:
      165px
      1fr;

    min-height: 92px;
  }

  .event.next {
    min-height: 132px;
  }

  .day {
    font-size: 58px;
  }

  .month {
    font-size: 18px;
  }

  .weekday {
    font-size: 15px;
  }

  .details {
    /*
     * Title deliberately gets substantially
     * more room than description.
     */

    grid-template-columns:
      195px
      minmax(0, 1.55fr)
      minmax(260px, 0.75fr);

    gap: 28px;

    padding:
      14px
      34px;
  }

  .event-meta {
    font-size: 22px;
  }

  .title {
    font-size: 28px;
  }

  .location {
    font-size: 18px;
  }

  .description {
    font-size: 17px;

    padding-left: 24px;
  }

  .event.next .title {
    font-size: 32px;
  }

  .event.next .description {
    font-size: 18px;
  }

}


/* ==================================================
   SMALLER THAN FULL-HD
================================================== */

@media (max-width: 1500px) {

  .page {
    padding:
      34px
      48px;
  }

  .header {
    margin-bottom: 38px;
  }

  .heading {
    font-size: 38px;
  }

  .datetime {
    font-size: 21px;
  }

  .event {
    grid-template-columns:
      140px
      1fr;
  }

  .details {
    grid-template-columns:
      165px
      minmax(0, 1.6fr)
      minmax(210px, 0.7fr);

    gap: 20px;

    padding:
      12px
      24px;
  }

  .event-meta {
    font-size: 18px;
  }

  .title {
    font-size: 23px;
  }

  .location {
    font-size: 16px;
  }

  .description {
    font-size: 15px;

    padding-left: 18px;
  }

  .event.next .title {
    font-size: 27px;
  }

  .event.next .description {
    font-size: 16px;
  }

}


/* ==================================================
   VERY NARROW FALLBACK

   Description disappears before we sacrifice
   readability of the actual announcement.
================================================== */

@media (max-width: 1100px) {

  .description {
    display: none;
  }

  .details {
    grid-template-columns:
      165px
      minmax(0, 1fr);
  }

}

</style>
</head>


<body>

<main class="page">

  <header class="header">

    <h1 class="heading">
      Upcoming at One Town Centre
    </h1>

    <div
      id="datetime"
      class="datetime"
    ></div>

  </header>


  <section
    id="events"
    class="events"
  ></section>

</main>


<div
  id="status"
  class="status"
></div>


<script>

/* ==================================================
   SETTINGS
================================================== */

const DATA_URL =
  'https://script.google.com/macros/s/AKfycbxWtIDDI_p34Ast0sKObU-2z5mp-UNApWQ9RTICJizoeXlqmY-BLu56pRgJf1Dwzonh/exec';

const MAX_UPCOMING_EVENTS = 5;

const LOOKAHEAD_DAYS = 60;

const REFRESH_INTERVAL =
  5 * 60 * 1000;


/* ==================================================
   DATE + TIME
================================================== */

function updateDateTime() {

  const now =
    new Date();


  const date =
    now.toLocaleDateString(
      'en-CA',
      {
        weekday: 'long',
        month: 'long',
        day: 'numeric'
      }
    );


  const time =
    now.toLocaleTimeString(
      'en-CA',
      {
        hour: 'numeric',
        minute: '2-digit',
        hour12: true
      }
    );


  document
    .getElementById('datetime')
    .textContent =
      date +
      ' · ' +
      time;

}


updateDateTime();

setInterval(
  updateDateTime,
  30000
);


/* ==================================================
   LOAD EVENTS
================================================== */

function loadEvents() {

  const callbackName =
    'calendarCallback_' +
    Date.now();


  const script =
    document.createElement(
      'script'
    );


  window[callbackName] =
    function(data) {

      try {

        const prepared =
          prepareEvents(
            Array.isArray(data)
              ? data
              : []
          );


        renderEvents(
          prepared
        );


        showStatus(
          'Updated'
        );

      }

      finally {

        delete window[
          callbackName
        ];


        script.remove();

      }

    };


  script.onerror =
    function() {

      delete window[
        callbackName
      ];


      script.remove();


      showStatus(
        'Update unavailable'
      );

    };


  script.src =
    DATA_URL +
    '?callback=' +
    callbackName +
    '&_=' +
    Date.now();


  document.body.appendChild(
    script
  );

}


/* ==================================================
   PREPARE EVENTS
================================================== */

function prepareEvents(events) {

  const now =
    new Date();


  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );


  const tomorrow =
    new Date(today);

  tomorrow.setDate(
    tomorrow.getDate() + 1
  );


  const cutoff =
    new Date(today);

  cutoff.setDate(
    cutoff.getDate() +
    LOOKAHEAD_DAYS
  );


  const pastToday = [];

  const upcoming = [];


  events.forEach(event => {

    if (!event.sortDate) {
      return;
    }


    const start =
      new Date(
        event.sortDate
      );


    if (
      start < today ||
      start > cutoff
    ) {
      return;
    }


    if (
      event.type === 'holiday'
    ) {

      upcoming.push(
        {
          ...event,
          isPast: false
        }
      );

      return;
    }


    const end =
      event.endDate
        ? new Date(event.endDate)
        : start;


    const startedToday =
      start >= today &&
      start < tomorrow;


    const hasEnded =
      !event.allDay &&
      end < now;


    if (
      startedToday &&
      hasEnded
    ) {

      pastToday.push(
        {
          ...event,
          isPast: true
        }
      );

    }

    else {

      upcoming.push(
        {
          ...event,
          isPast: false
        }
      );

    }

  });


  pastToday.sort(
    (a, b) =>
      new Date(a.sortDate) -
      new Date(b.sortDate)
  );


  upcoming.sort(
    (a, b) =>
      new Date(a.sortDate) -
      new Date(b.sortDate)
  );


  const futureItems =
    upcoming.slice(
      0,
      MAX_UPCOMING_EVENTS
    );


  /*
   * First upcoming BUILDING event gets
   * the larger "next" treatment.
   *
   * Completed events and holidays do not.
   */

  let nextAssigned =
    false;


  futureItems.forEach(
    event => {

      event.isNext =
        false;


      if (
        !nextAssigned &&
        event.type !== 'holiday'
      ) {

        event.isNext =
          true;

        nextAssigned =
          true;
      }

    }
  );


  return pastToday.concat(
    futureItems
  );

}


/* ==================================================
   RENDER
================================================== */

function renderEvents(events) {

  const container =
    document.getElementById(
      'events'
    );


  if (
    !events ||
    events.length === 0
  ) {

    container.innerHTML =
      '<div class="empty-state">' +
      'No upcoming building events' +
      '</div>';

    return;

  }


  container.innerHTML =
    events
      .map(
        event =>
          buildEventHTML(
            event
          )
      )
      .join('');

}


/* ==================================================
   BUILD EVENT CARD
================================================== */

function buildEventHTML(
  event
) {

  const holiday =
    event.type ===
    'holiday';


  const classes = [
    'event'
  ];


  if (holiday) {
    classes.push(
      'holiday'
    );
  }


  if (event.isPast) {
    classes.push(
      'past'
    );
  }


  if (event.isNext) {
    classes.push(
      'next'
    );
  }


  const color =
    isValidHexColor(
      event.color
    )
      ? event.color
      : '#17636B';


  const location =
    !holiday &&
    event.location
      ? `
          <div class="location">
            ${escapeHTML(event.location)}
          </div>
        `
      : '';


  const description =
    !holiday &&
    event.description
      ? `
          <div class="description">
            ${escapeHTML(event.description)}
          </div>
        `
      : `
          <div class="description empty"></div>
        `;


  const time =
    event.time
      ? escapeHTML(
          event.time
        )
      : '';


  return `
    <article
      class="${classes.join(' ')}"
      style="--event-color: ${color};"
    >

      <div class="date-block">

        <div class="day">
          ${escapeHTML(event.day || '')}
        </div>

        <div class="date-text">

          <div class="month">
            ${escapeHTML(event.month || '')}
          </div>

          <div class="weekday">
            ${escapeHTML(event.weekday || '')}
          </div>

        </div>

      </div>


      <div class="details">

        <div class="event-meta">
          ${time}
        </div>


        <div class="event-info">

          <div class="title">
            ${escapeHTML(event.title || '')}
          </div>

          ${location}

        </div>


        ${description}

      </div>

    </article>
  `;

}


/* ==================================================
   HELPERS
================================================== */

function isValidHexColor(
  value
) {

  return (
    typeof value ===
      'string' &&
    /^#[0-9A-Fa-f]{6}$/.test(
      value
    )
  );

}


function escapeHTML(
  value
) {

  return String(
    value ?? ''
  )

    .replace(
      /&/g,
      '&amp;'
    )

    .replace(
      /</g,
      '&lt;'
    )

    .replace(
      />/g,
      '&gt;'
    )

    .replace(
      /"/g,
      '&quot;'
    )

    .replace(
      /'/g,
      '&#039;'
    );

}


function showStatus(
  text
) {

  const element =
    document.getElementById(
      'status'
    );


  element.textContent =
    text;


  element.classList.add(
    'visible'
  );


  clearTimeout(
    window.statusTimer
  );


  window.statusTimer =
    setTimeout(
      () => {

        element.classList.remove(
          'visible'
        );

      },
      2500
    );

}


/* ==================================================
   INITIAL LOAD
================================================== */

loadEvents();


setInterval(
  loadEvents,
  REFRESH_INTERVAL
);

</script>

</body>
</html>
